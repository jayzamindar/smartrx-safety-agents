[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrx-safety-agents"
version = "0.1.0"
description = "Deterministic-first multi-agent clinical medication reconciliation and safety verification system"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "filelock>=3.14.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
smartrx-safety-agents = "smartrx_safety_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 15
timeout_method = "thread"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["smartrx_safety_agents"]
