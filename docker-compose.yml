services:
  smartrx-safety-agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartrx-safety-agents:latest
    container_name: smartrx-safety-agents
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY must be set}
      PLAN_SIGNING_SECRET: ${PLAN_SIGNING_SECRET:?PLAN_SIGNING_SECRET must be set}
      SMARTRX_SAFETY_AGENTS_WEBHOOK_SECRET: ${SMARTRX_SAFETY_AGENTS_WEBHOOK_SECRET:?SMARTRX_SAFETY_AGENTS_WEBHOOK_SECRET must be set}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-3.8-flash-high}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-2048}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-8192}
      SMARTRX_DB_PATH: /app/data/smartrx_ledger.db
      AUDIT_LOG_DIR: /app/audit_logs
    volumes:
      - ./data:/app/data
      - ./audit_logs:/app/audit_logs
    mem_limit: 2048m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
