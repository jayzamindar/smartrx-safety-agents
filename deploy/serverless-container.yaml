apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smartrx-safety-agents
  labels:
    app.kubernetes.io/name: smartrx-safety-agents
    app.kubernetes.io/part-of: smartrx-clinical-guard
  annotations:
    # Portable Cloud Run / Azure Container Apps / AWS ECS Fargate baseline
    autoscaling.knative.dev/minScale: "0"
    # Pinned to 1 instance: single-writer SQLite WAL (SMARTRX_DB_PATH=/app/data/smartrx_ledger.db)
    # requires single-instance write serialization unless sharded per instance.
    autoscaling.knative.dev/maxScale: "1"
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/target: "20"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/<PROJECT_ID>/smartrx/smartrx-safety-agents:v1.0.0
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "2048Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: REQUIRE_AUTH
              value: "true"
            - name: GEMINI_MODEL_NAME
              value: "gemini-3.8-flash-high"
            - name: GEMINI_THINKING_BUDGET
              value: "2048"
            - name: MAX_OUTPUT_TOKENS
              value: "8192"
            - name: SMARTRX_DB_PATH
              value: "/app/data/smartrx_ledger.db"
            - name: AUDIT_LOG_DIR
              value: "/app/audit_logs"
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartrx-secrets
                  key: mcp-api-key
            - name: PLAN_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartrx-secrets
                  key: plan-signing-secret
            - name: SMARTRX_SAFETY_AGENTS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartrx-secrets
                  key: webhook-secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartrx-secrets
                  key: gemini-api-key
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            # POSIX-compliant persistent volume required for SQLite WAL + filelock.FileLock
            - name: smartrx-posix-ledger
              mountPath: /app/data
            # Ephemeral in-container JSONL buffer (512Mi ceiling); sync to GCS or mount Filestore for durability
            - name: smartrx-audit-logs
              mountPath: /app/audit_logs
      volumes:
        # Bind to Cloud Filestore (NFS) PVC in production; GCS FUSE is unsupported for SQLite WAL
        - name: smartrx-posix-ledger
          persistentVolumeClaim:
            claimName: smartrx-ledger-pvc
        # Ephemeral emptyDir for daily JSONL rotation; export/archive to GCS or replace with Filestore PVC for multi-revision durability
        - name: smartrx-audit-logs
          emptyDir:
            sizeLimit: "512Mi"
